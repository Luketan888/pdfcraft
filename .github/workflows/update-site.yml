# Keeps the website on the gh-pages branch in step with the official PdfCraft releases.
# Once a day it checks storytold/pdfcraft for a newer release. If there is one, it downloads the
# official web build (pdfcraft-web-<version>.zip) and replaces the site with it, keeping the
# custom domain (CNAME). Run it by hand from the Actions tab with "Run workflow".
name: Update site

on:
  schedule:
    - cron: "23 2 * * *" # daily, 10:23 Singapore time
  workflow_dispatch:
    inputs:
      force:
        description: "Redeploy even if the site is already on the latest version"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site
  cancel-in-progress: false

env:
  UPSTREAM: storytold/pdfcraft
  ASSET: pdfcraft-web-*.zip

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Compare versions
        id: check
        run: |
          latest=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          current=$(gh api "repos/$REPO/contents/VERSION?ref=gh-pages" -q .content 2>/dev/null | base64 -d | tr -d '[:space:]' || true)
          echo "Official release: $latest | Site: ${current:-unknown}"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Site is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and unpack the official web build
        if: steps.check.outputs.update == 'true'
        run: |
          gh release download "${{ steps.check.outputs.latest }}" -R "$UPSTREAM" -p "$ASSET" -D dl
          unzip -q dl/*.zip -d dl/unz
          mkdir site
          cp -R dl/unz/*/. site/
          test -f site/index.html || { echo "::error::index.html missing from the release zip"; exit 1; }
          # Precompressed copies (.br/.gz) aren't used by GitHub Pages, which compresses on its own.
          find site -type f \( -name '*.br' -o -name '*.gz' \) | while read -r f; do
            [ -f "${f%.*}" ] && rm "$f"
          done
          big=$(find site -type f -size +99M)
          if [ -n "$big" ]; then
            echo "::error::GitHub Pages rejects files over 100 MB: $big"; exit 1
          fi

      - name: Publish to gh-pages
        if: steps.check.outputs.update == 'true'
        run: |
          cname=$(gh api "repos/$REPO/pages" -q '.cname // empty' 2>/dev/null || true)
          cd site
          [ -n "$cname" ] && echo "$cname" > CNAME
          touch .nojekyll
          echo "${{ steps.check.outputs.latest }}" > VERSION
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update site to ${{ steps.check.outputs.latest }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
          gh api -X POST "repos/$REPO/pages/builds" >/dev/null || true
          echo "Site updated to ${{ steps.check.outputs.latest }}${cname:+ ($cname)}" >> "$GITHUB_STEP_SUMMARY"
